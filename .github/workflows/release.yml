# Builds a release when a version tag (v0.1, v0.2, ...) is pushed: signed with
# Developer ID, notarized and stapled by scripts/build-release.sh, with a
# build-provenance attestation, attached to a *draft* GitHub release. A person
# tests the zip and publishes the draft.
#
# Signing secrets live in the `release` environment (Settings > Environments),
# which should only admit v* tags and require a reviewer. See
# docs/DEVELOPMENT.md, "Releases".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the draft release
  id-token: write       # sign the attestation
  attestations: write   # store it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' SSHFS.xcodeproj/project.pbxproj | sort -u)
          echo "app version: $version, tag: $TAG"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG doesn't match MARKETING_VERSION $version"; exit 1; }

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Signing setup
        env:
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          DEVID_PROFILE_BASE64: ${{ secrets.DEVID_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          KC=$RUNNER_TEMP/signing.keychain-db
          KCPASS=$(openssl rand -hex 24)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf %s "$DEVID_P12_BASE64" | base64 -D > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning
          printf %s "$DEVID_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/devid.provisionprofile"
          printf %s "$ASC_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          INSTALL: '0'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export PROFILE=$RUNNER_TEMP/devid.provisionprofile
          export ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          scripts/build-release.sh

      - name: Build log
        if: failure()
        run: tail -50 build/xcodebuild-release.log || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/SSHFS.zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(shasum -a 256 build/SSHFS.zip | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Built by GitHub Actions from ${GITHUB_SHA} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): signed with Developer ID, notarized and stapled by Apple. Requires macOS 27.

          Install: see the [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#install).

          SHA-256 of \`SSHFS.zip\`: \`${sha}\`

          Check that this zip was built here, from this tag's commit:

          \`\`\`
          gh attestation verify SSHFS.zip --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "$TAG" build/SSHFS.zip --draft --verify-tag \
            --title "sshfs ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.provisionprofile" "$RUNNER_TEMP/devid.p12"
